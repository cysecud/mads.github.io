- acronym: TRUTHSTER POC
  name: Implementation of the TRUTHSTER platform for certifying digital media via blockchain
  funding: PR FESR FVG 2021–2027 · Proof of Concept
  period: 5/2025 – 7/2026
  status: current
  groups: [cybersecurity]
  summary: >-
    Brings the TRUTHSTER platform to a market-ready service: a mobile app connected to a
    blockchain that certifies authorship, consent and authenticity of digital media.
  url: https://www.uniud.it/it/ricerca/progetti-e-iniziative/progetti-finanziati/pr-fesr/truthster-poc-implementazione-della-piattaforma-truthster-per-certificazione-di-media-digitali-mediante-blockchain

- acronym: STENDHAL
