  funding: MUR PRIN 2022
  period: 10/2023 – 2/2026
  status: past
  summary: >-
    Spatio-temporal model checking of image sequences, integrated with neural networks,
    with case studies in healthcare and cyber-physical systems. Led by the University of Pisa with CNR.
  url: https://www.uniud.it/it/ricerca/progetti-e-iniziative/progetti-finanziati/prin-2022/dmif/stendhal-spatio-temporal-enhancement-of-neural-nets-for-deeply-hierarchical-automatised-logic

